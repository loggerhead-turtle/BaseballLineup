# fly.toml app configuration file generated for baseballlineup on 2026-07-04T01:33:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'baseballlineup'
primary_region = 'lax'

[build]

[env]
  BIND_ADDR = '0.0.0.0:8080'
  DATABASE_URL = '/data/lineup.db'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'lineup_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
